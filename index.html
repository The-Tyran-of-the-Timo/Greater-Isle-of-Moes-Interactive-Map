<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Island Map</title>

  <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- MAP -->
  <div id="map"></div>

  <!-- LAYER CONTROL PANEL -->
  <div id="menu">
    <h3>Layers</h3>

    <label><input type="checkbox" checked onchange="toggleLayer('parks-layer', this.checked)"> Parks</label><br>
    <label><input type="checkbox" checked onchange="toggleLayer('river-layer', this.checked)"> Rivers</label><br>
    <label><input type="checkbox" checked onchange="toggleLayer('poi-layer', this.checked)"> POIs</label><br>
    <label><input type="checkbox" checked onchange="toggleLayer('elevation-layer', this.checked)"> Elevation</label><br>
    <label><input type="checkbox" checked onchange="toggleLayer('outline-layer', this.checked)"> Outline</label><br>

    <hr>

    <label><input type="checkbox" checked onchange="toggleLayer('poi-labels', this.checked)"> Labels</label>
  </div>

  <!-- MAP LIBRARY -->
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>

  <!-- YOUR SCRIPT -->
  <script src="app.js"></script>

</body>
</html>
